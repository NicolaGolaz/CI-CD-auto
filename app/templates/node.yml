name: Node.js CI
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: {{WORKING_DIRECTORY}}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: {{WORKING_DIRECTORY}}/package-lock.json
      - name: Install dependencies
        run: npm install
{{LINT_STEPS}}
{{TEST_STEPS}}
      - name: Prepare artifact
        run: |
          DEST="$GITHUB_WORKSPACE/artifact_staging"
          mkdir -p "$DEST"

          cp -rp . "$DEST/"
          
          cd "$DEST"
          rm -rf .git .github node_modules .cache .npm .eslintcache .prettiercache coverage logs *.log
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }} 
          path: artifact_staging/
          retention-days: 7